name: Fly.io Deploy — portfolio-line-bot

# Auto-deploy api-server to Fly.io on push to main.
# Required repo secret: FLY_API_TOKEN (https://fly.io/user/tokens)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-portfolio-line-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy api-server to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config artifacts/api-server/fly.toml \
            --remote-only \
            --strategy bluegreen \
            --wait-timeout 600

      - name: Healthz probe (post-deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sleep 15
          flyctl checks list --app portfolio-line-bot -j || true
          echo "---"
          curl -fsS --max-time 15 https://portfolio-line-bot.fly.dev/api/healthz \
            && echo " ✓ /api/healthz OK" \
            || (echo " ✗ /api/healthz failed" && exit 1)

      # 部署成功後,自動重發 LINE rich menu,讓新圖 / 新 spec 立刻生效在 channel。
      # 跳過邏輯在 step 內做(空 secret 用 `|| ''` 補,再判空跳過),不用 `if: ${{ secrets.X }}`
      # 因為 GitHub Actions runner 不接受 step-level 直接比對 secret 表達式。
      # secret 在 logs 自動 mask(`***`),只 `x-admin-token` header 傳,不會印出來。
      # continue-on-error:rich menu 失敗不擋 deploy(已被 healthz 確認上線)。
      - name: Refresh LINE rich menu
        continue-on-error: true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '' }}
          RICH_MENU_HOST: portfolio-line-bot.fly.dev
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::ADMIN_PASSWORD secret not set; skipping rich menu refresh."
            exit 0
          fi
          echo "POST /api/admin/rich-menu?refresh=1 ..."
          status=$(curl -sS -o /tmp/rich.json -w "%{http_code}" \
            -X POST \
            -H "x-admin-token: ${ADMIN_PASSWORD}" \
            --max-time 30 \
            "https://${RICH_MENU_HOST}/api/admin/rich-menu?refresh=1")
          echo "HTTP ${status}"
          cat /tmp/rich.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "::warning::rich menu refresh failed (HTTP ${status}); deploy already succeeded"
          fi
