name: Fly.io Deploy — portfolio-line-bot

# Auto-deploy api-server to Fly.io on push to main.
# Required repo secret: FLY_API_TOKEN (https://fly.io/user/tokens)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-portfolio-line-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy api-server to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config artifacts/api-server/fly.toml \
            --remote-only \
            --strategy bluegreen \
            --wait-timeout 600

      - name: Healthz probe (post-deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          sleep 15
          flyctl checks list --app portfolio-line-bot -j || true
          echo "---"
          curl -fsS --max-time 15 https://portfolio-line-bot.fly.dev/api/healthz \
            && echo " ✓ /api/healthz OK" \
            || (echo " ✗ /api/healthz failed" && exit 1)

      # ⚠️ 這一步已被**拿掉**(2026-10-23)。
      #
      # 原因:rich menu 已經改成 3 頁籤(richmenuswitch + alias),不再是單一 1×3。
      # `/api/admin/rich-menu?refresh=1` 這個舊 route 會 `listRichMenus()` 全刪
      # 再重建**一個** 1×3 — 跑下去會把 3 個頁籤整個滅掉。
      #
      # 多頁籤要用 `scripts/src/setup-line-richmenu.ts` 發布(它才會建 alias),
      # 而且是**手動**跑、需要人看過圖再決定:
      #     cd scripts
      #     LINE_CHANNEL_ACCESS_TOKEN=... pnpm run setup-line-richmenu        # 只出圖
      #     APPLY=1 LINE_CHANNEL_ACCESS_TOKEN=... pnpm run setup-line-richmenu # 真的上線
