# Fly.io config for the LINE bot api-server.
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy: 首選 GitHub Actions(`.github/workflows/fly-deploy.yml`),
#         觸發條件 push 到 main + paths 含 `artifacts/api-server/**`。
#         step 包含 deploy + healthz probe + 自動重發 LINE rich menu
#         (需要 ADMIN_PASSWORD secret,跳過條件 `secrets.ADMIN_PASSWORD == ''`)。
# 手動:`fly deploy --config artifacts/api-server/fly.toml --remote-only`
# secret:FLY_API_TOKEN(repo Settings → Secrets → Actions)

app = "portfolio-line-bot"
primary_region = "sin"   # Singapore — closest to TW for low LINE webhook latency

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # keep webhook reachable; do not sleep on inactivity
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Secrets — set via `fly secrets set KEY=value` or in the GitHub Actions workflow.
# Required (do NOT commit actual values):
#   DATABASE_URL
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_CHANNEL_SECRET
#   ADMIN_PASSWORD
#   SESSION_SECRET
