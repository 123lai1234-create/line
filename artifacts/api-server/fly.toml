# Fly.io config for the LINE bot api-server.
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy: `fly deploy --config artifacts/api-server/fly.toml`
#   or via GitHub Actions workflow `.github/workflows/fly-deploy.yml`
# (FLY_API_TOKEN secret required in repo settings).

app = "portfolio-line-bot"
primary_region = "sin"   # Singapore — closest to TW for low LINE webhook latency

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # keep webhook reachable; do not sleep on inactivity
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Secrets — set via `fly secrets set KEY=value` or in the GitHub Actions workflow.
# Required (do NOT commit actual values):
#   DATABASE_URL
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_CHANNEL_SECRET
#   ADMIN_PASSWORD
#   SESSION_SECRET
