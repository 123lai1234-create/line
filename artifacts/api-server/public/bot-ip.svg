<?xml version="1.0" encoding="UTF-8"?>
<!--
  不說的助理 — 機器人 IP (小詠機器人風格借鑑)
  ──────────────────────────────────────────────
  • 圓潤白色頭部 + 黑色螢幕臉
  • 兩個白色大眼睛 + 綠色瞳孔
  • 圓潤微笑嘴
  • 白色圓潤身體 + 綠色裝飾帶
  • 頭頂綠色天線（訊號感）
  • 整體白+綠+黑配色 — 跟小詠機器人的白+橘視覺一致，只是改成「不說」配色

  用 @resvg/resvg-js 轉成 PNG 後，部署到 Vercel/Railway 公開 URL，在 Flex Message / 歡迎訊息 / Rich Menu 用。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a4a3c"/>
      <stop offset="100%" stop-color="#0d2118"/>
    </radialGradient>
    <linearGradient id="bodySheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5ee"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- 背景圓（深綠色頭部裝飾環） -->
  <circle cx="120" cy="120" r="116" fill="url(#bg)"/>

  <!-- 微弱的光環（裝飾用） -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#2E7D5B" stroke-width="1.5" opacity="0.35"/>

  <!-- 機器人身體（白色圓潤，bottom half） -->
  <ellipse cx="120" cy="172" rx="62" ry="46" fill="url(#bodySheen)"/>

  <!-- 身體綠色裝飾帶 -->
  <ellipse cx="120" cy="172" rx="48" ry="13" fill="#2E7D5B"/>

  <!-- 身體裝飾按鈕（白點） -->
  <circle cx="100" cy="172" r="4" fill="#ffffff"/>
  <circle cx="120" cy="172" r="4" fill="#ffffff"/>
  <circle cx="140" cy="172" r="4" fill="#ffffff"/>

  <!-- 機器人頭（白色圓角矩形） -->
  <rect x="68" y="56" width="104" height="84" rx="22" fill="url(#bodySheen)"/>

  <!-- 頭部裝飾條（綠色）— 兩側耳機感 -->
  <rect x="68" y="80" width="8" height="36" rx="4" fill="#2E7D5B"/>
  <rect x="164" y="80" width="8" height="36" rx="4" fill="#2E7D5B"/>

  <!-- 螢幕臉（黑色） -->
  <rect x="80" y="66" width="80" height="58" rx="14" fill="url(#screen)"/>

  <!-- 螢幕臉內框（綠色細邊） -->
  <rect x="80" y="66" width="80" height="58" rx="14" fill="none" stroke="#2E7D5B" stroke-width="0.8" opacity="0.6"/>

  <!-- 左眼 -->
  <circle cx="103" cy="95" r="11" fill="#ffffff"/>
  <circle cx="106" cy="92" r="5" fill="#2E7D5B"/>
  <circle cx="108" cy="89" r="2" fill="#ffffff"/>

  <!-- 右眼 -->
  <circle cx="137" cy="95" r="11" fill="#ffffff"/>
  <circle cx="140" cy="92" r="5" fill="#2E7D5B"/>
  <circle cx="142" cy="89" r="2" fill="#ffffff"/>

  <!-- 微笑嘴 -->
  <path d="M 105 125 Q 120 138 135 125" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 頭頂天線（訊號感） -->
  <line x1="120" y1="56" x2="120" y2="32" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="28" r="6" fill="#2E7D5B"/>
  <circle cx="120" cy="28" r="3" fill="#ffffff"/>
</svg>